<div class="support-menu"
     id="supportMenu"
     aria-label="Customer support options">

    <p class="support-title">Customer Support</p>
    <p class="support-description">How can we help you today?</p>

    <a class="support-link email-support"
       href="mailto:Fednowsharesteam@gmail.com?subject=Fednow%20Shares%20Customer%20Support">
        Email Support
    </a>

    <a class="support-link whatsapp-support"
       href="https://wa.me/447549589541"
       target="_blank"
       rel="noopener noreferrer">
        WhatsApp Support
    </a>

</div>

<script>
function continueDeposit() {
    const amountField = document.getElementById("depositAmount");
    const errorMessage = document.getElementById("errorMessage");
    const amount = Number(amountField.value);

    errorMessage.classList.remove("show");
    errorMessage.textContent = "";

    if (
        amountField.value.trim() === "" ||
        !Number.isFinite(amount) ||
        amount < 50
    ) {
        errorMessage.textContent =
            "Please enter a valid deposit amount of at least $50 USD.";
        errorMessage.classList.add("show");
        amountField.focus();
        return;
    }

    if (!Number.isFinite(amount) || amount > 1000000000) {
        errorMessage.textContent =
            "Please enter a valid deposit amount.";
        errorMessage.classList.add("show");
        amountField.focus();
        return;
    }

    /*
      Pass the selected amount to the next page.
      Ensure deposit.html exists in the same GitHub Pages directory.
    */
    window.location.href =
        "deposit.html?amount=" + encodeURIComponent(amount.toFixed(2));
}

/* CUSTOMER SUPPORT MENU */

function openSupport() {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");
    const isOpen = supportMenu.classList.toggle("open");

    chatButton.setAttribute("aria-expanded", String(isOpen));
}

function closeSupport() {
    document.getElementById("supportMenu").classList.remove("open");
    document.querySelector(".chat-button")
        .setAttribute("aria-expanded", "false");
}

document.addEventListener("click", function(event) {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");

    if (
        !supportMenu.contains(event.target) &&
        !chatButton.contains(event.target)
    ) {
        closeSupport();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeSupport();
    }
});

/*
  The language selector is a visual selector only.
  Actual translation requires translated page content.
*/
document.getElementById("languageSelect").addEventListener("change", function() {
    if (this.value !== "en") {
        this.value = "en";
        alert("This language is not available yet.");
    }
});
</script>
