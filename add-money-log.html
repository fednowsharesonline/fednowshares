<script>
function toggleMenu() {
    location.href = "dashboard.html";
}

function openSupport() {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");
    const isOpen = supportMenu.classList.toggle("open");

    chatButton.setAttribute("aria-expanded", String(isOpen));
}

function closeSupport() {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");

    supportMenu.classList.remove("open");
    chatButton.setAttribute("aria-expanded", "false");
}

document.addEventListener("click", function(event) {
    const supportMenu = document.getElementById("supportMenu");
    const chatButton = document.querySelector(".chat-button");

    if (!supportMenu.contains(event.target) &&
        !chatButton.contains(event.target)) {
        closeSupport();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeSupport();
    }
});

/* Read the deposit amount from the URL when provided. */
const params = new URLSearchParams(window.location.search);
const amountValue = params.get("amount");
const amount = Number(amountValue);

if (
    amountValue !== null &&
    amountValue.trim() !== "" &&
    Number.isFinite(amount) &&
    amount > 0
) {
    document.getElementById("depositAmount").textContent =
        "$" + amount.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " Deposit";
}

/*
  IMPORTANT:
  The displayed payment status and transaction ID are sample page content.
  A real payment system must retrieve the verified status and transaction ID
  from a trusted backend after confirming the payment.
*/
</script>
